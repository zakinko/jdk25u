name: 'Build (NetBSD)'

on:
  workflow_call:
    inputs:
      platform:
        required: true
        type: string
      runs-on:
        required: true
        type: string
      vm-arch:
        required: true
        type: string
      vm-release:
        required: true
        type: string
      extra-conf-options:
        required: false
        type: string
      make-target:
        required: false
        type: string
        default: 'product-bundles test-bundles'
      debug-levels:
        required: false
        type: string
        default: '[ "debug", "release" ]'
      configure-arguments:
        required: false
        type: string
      make-arguments:
        required: false
        type: string

jobs:
  build-netbsd:
    name: build
    runs-on: ${{ inputs.runs-on }}

    env:
      MYTOKEN : ${{ secrets.MYTOKEN }}

    strategy:
      fail-fast: false
      matrix:
        debug-level: ${{ fromJSON(inputs.debug-levels) }}
        include:
          - debug-level: debug
            flags: --with-debug-level=fastdebug
            suffix: -debug

    steps:
      - name: Setup Host for VM
        run: |
          echo "Starting storage:"
          sudo df -h
          echo "Removing Android SDKs and Tools"
          sudo rm -rf /usr/local/lib/android
          echo "Reduce swappiness"
          sudo sysctl vm.swappiness=10
          echo "Available storage:"
          sudo df -h

      - name: 'Checkout the JDK source'
        uses: actions/checkout@v6

      - name: 'Set the BootJDK path'
        id: bootjdk
        run: echo 'path=/usr/pkg/java/openjdk25' >> $GITHUB_OUTPUT

      - name: 'Get JTReg'
        id: jtreg
        uses: ./.github/actions/get-jtreg

      - name: 'Get GTest'
        id: gtest
        uses: ./.github/actions/get-gtest

      - name: 'Start NetBSD VM'
        uses: vmactions/netbsd-vm@v1
        with:
          release: ${{ inputs.vm-release }}
          arch: ${{ inputs.vm-arch }}
          mem: 12288
          cpu: 4
          envs: 'MYTOKEN'
          usesh: true
          copyback: false
          prepare: |
            mount -t procfs procfs /proc
            # The image carries no X11 sets, and the build wants the headers
            # even when headless (configure asks for Xlib.h, shape.h, Xrender.h
            # and the rest before it looks at --enable-headless-only).  Take
            # xbase and xcomp from the release the VM is running.
            REL=`uname -r | cut -d_ -f1`
            ARCH=`uname -m`
            for set in xbase xcomp; do
              ftp -o /var/tmp/$set.tar.xz "https://cdn.NetBSD.org/pub/NetBSD/NetBSD-$REL/$ARCH/binary/sets/$set.tar.xz"
              tar -xJpf /var/tmp/$set.tar.xz -C /
              rm -f /var/tmp/$set.tar.xz
            done
            ls /usr/X11R7/include/X11/Xlib.h
            # There is no openjdk25 in NetBSD's binary repository yet -- JDK 25
            # accepts only a 24 or 25 boot JDK, and pkgsrc stops at 21 -- so
            # the boot JDK is the bootstrap kit lang/openjdk25 will use: a JDK
            # 25 cross-built against the NetBSD 10.1 sysroot.  It carries no
            # PaX mark (paxctl exists only on NetBSD), so mark it here the way
            # the package does on extraction.
            KIT=bootstrap-jdk-1.25.0.5.0-netbsd-10-amd64-20260921.tar.xz
            ftp -o /var/tmp/$KIT "https://github.com/zakinko/jdk25u/releases/download/bootstrap-kit-25-20260921/$KIT"
            mkdir -p /usr/pkg/java
            tar -xJf /var/tmp/$KIT -C /usr/pkg/java
            mv /usr/pkg/java/bootstrap /usr/pkg/java/openjdk25
            rm -f /var/tmp/$KIT
            find /usr/pkg/java/openjdk25 -type f \( -perm -u+x -o -name '*.so' \) -print |
              while read f; do /usr/sbin/paxctl +m "$f" >/dev/null 2>&1 || :; done
            /usr/pkg/java/openjdk25/bin/java -version
            echo 'cd $GITHUB_WORKSPACE' >> ~/.vmenv

      # Warnings are not errors here, which is how pkgsrc's lang/openjdk25
      # builds this tree too.  With them, the base gcc stops at an unused
      # function the NetBSD branch of os_bsd.cpp never calls.
      # The image's pkg_add already points at NetBSD's binary repository.
      # The boot JDK is pkgsrc's lang/openjdk25, the X11 headers and
      # libraries are in the base system under /usr/X11R7, and the compiler
      # is the base gcc.
      - name: 'Install toolchain and dependencies in VM'
        shell: netbsd {0}
        run: >
          /usr/sbin/pkg_add grep autoconf automake pkgconf gtar zip unzip cups bash gmake gsed libiconv harfbuzz lcms2 png giflib libjpeg-turbo fontconfig freetype2 alsa-lib

      - name: 'Configure in VM'
        shell: netbsd {0}
        run: >
          . ~/.vmenv &&
          bash configure
          SED=/usr/pkg/bin/gsed
          GREP=/usr/pkg/bin/ggrep
          --with-conf-name=${{ inputs.platform }}
          ${{ matrix.flags }}
          --with-version-opt=${GITHUB_ACTOR}-${GITHUB_SHA}
          --with-boot-jdk=${{ steps.bootjdk.outputs.path }}
          --with-jtreg=${{ steps.jtreg.outputs.path }}
          --with-gtest=${{ steps.gtest.outputs.path }}
          --with-zlib=system
          --with-jmod-compress=zip-1
          --with-stdc++lib=dynamic
          --with-toolchain-type=gcc
          --disable-warnings-as-errors
          --with-fontconfig=/usr/pkg
          --with-cups=/usr/pkg
          --with-freetype=system
          --with-zlib=system
          --with-libpng=system
          --with-libjpeg=system
          --with-lcms=system
          --with-harfbuzz=system
          --with-giflib=system
          --with-giflib-include=/usr/pkg/include
          --with-giflib-lib=/usr/pkg/lib
          --with-alsa=/usr/pkg
          --x-includes=/usr/X11R7/include
          --x-libraries=/usr/X11R7/lib
          ${{ inputs.extra-conf-options }} ${{ inputs.configure-arguments }} || (
          echo "Dumping config.log:" &&
          cat config.log &&
          exit 1)

      - name: 'Build In VM'
        id: build
        uses: ./.github/actions/do-build-vm
        with:
          make-target: '${{ inputs.make-target }} ${{ inputs.make-arguments }}'
          platform: ${{ inputs.platform }}
          vm-name: 'netbsd'
          debug-suffix: '${{ matrix.suffix }}'

      - name: 'Check Memory, Swap and Disk Usage'
        run: |
          echo "Memory and swap:"
          sudo free -h
          echo
          echo "Available storage:"
          sudo df -h

      - name: 'Upload bundles'
        uses: ./.github/actions/upload-bundles
        with:
          platform: ${{ inputs.platform }}
          debug-suffix: '${{ matrix.suffix }}'
