#
# Cross-build a NetBSD/amd64 or DragonFly/x86_64 JDK and keep the bundle.
#
# This is not part of the BSD port that goes upstream.  It exists because
# neither OS can build JDK 25 from what it ships: pkgsrc's lang/openjdk21
# bootstraps from a prebuilt bootstrap-jdk tarball hosted by NetBSD, dports
# stops at openjdk21, and JDK 21 cannot compile JDK 25.  Somebody has to
# produce the first kit of 25, and a cross build from Linux is cheaper than
# four chained native builds.
#
# What comes out is a candidate, not a verified boot JDK: nothing here runs a
# line of it.  That has to happen on a machine running the target OS.
#
name: 'Bootstrap kit'

on:
  push:
    branches:
      - bootstrap-kit-25
  workflow_dispatch:
    inputs:
      target-os:
        description: 'Which OS to build the kit for'
        type: choice
        options: [netbsd, dragonfly]
        default: netbsd
      netbsd-version:
        description: 'NetBSD release to build the sysroot from (netbsd only)'
        required: false
        default: '10.1'

concurrency:
  group: bootstrap-kit-${{ github.ref }}-${{ inputs.target-os || 'netbsd' }}
  cancel-in-progress: true

env:
  # The kit has to run on every NetBSD it is meant to serve, so build it against
  # the oldest one rather than the newest.  9.4 does not work: its headers have
  # no PTHREAD_STACK_MIN, which os_posix.cpp needs.  10.1 is the oldest release
  # this can be built against, so a kit from here serves 10 and 11.
  NETBSD_SETS_VERSION: ${{ inputs.netbsd-version || '10.1' }}
  # DragonFly has one supported release line and the sysroot script pins it
  # (6.4.2), so there is nothing to choose there.
  TARGET_OS: ${{ inputs.target-os || 'netbsd' }}
  TARGET_TRIPLE: ${{ (inputs.target-os || 'netbsd') == 'dragonfly' && 'x86_64-unknown-dragonfly' || 'x86_64-unknown-netbsd' }}

jobs:
  kit:
    name: 'cross build'
    runs-on: ubuntu-24.04

    steps:
      - name: 'Checkout the JDK source'
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: 'Get the BootJDK'
        id: bootjdk
        uses: ./.github/actions/get-bootjdk
        with:
          platform: linux-x64

      - name: 'Install toolchain and dependencies'
        run: |
          sudo apt-get update
          sudo apt-get install --only-upgrade apt
          sudo apt-get install clang lld llvm autoconf zip unzip file \
              libarchive-tools libcups2-dev libfontconfig1-dev

      - name: 'Check cache for sysroot'
        id: get-cached-sysroot
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: sysroot
          key: sysroot-${{ env.TARGET_OS }}-${{ env.NETBSD_SETS_VERSION }}-${{ hashFiles('./.github/scripts/gen-bsd-sysroot.sh') }}

      - name: 'Create sysroot'
        run: bash .github/scripts/gen-bsd-sysroot.sh "$TARGET_OS" sysroot
        if: steps.get-cached-sysroot.outputs.cache-hit != 'true'

      - name: 'Prepare the cross compiler'
        run: >
          bash .github/scripts/gen-bsd-crosstool.sh
          "$TARGET_OS" "$TARGET_TRIPLE" "$PWD/sysroot" "$PWD/cross-bin"

      - name: 'Configure'
        run: >
          PATH="$PWD/cross-bin:$PATH"
          bash configure
          --with-conf-name=bsd-x86_64-$TARGET_OS
          --with-boot-jdk=${{ steps.bootjdk.outputs.path }}
          --openjdk-target=$TARGET_TRIPLE
          --with-sysroot=$PWD/sysroot
          --with-toolchain-type=clang
          --with-freetype=bundled
          --enable-headless-only
          --disable-dtrace
          --disable-precompiled-headers
          --with-jmod-compress=zip-1
          --with-external-symbols-in-bundles=none
          CC=$TARGET_TRIPLE-clang
          CXX=$TARGET_TRIPLE-clang++
          BUILD_CC=clang
          BUILD_CXX=clang++
          || (echo "Dumping config.log:" && cat config.log && exit 1)

      - name: 'Build the bundle'
        run: make LOG=info product-bundles

      - name: 'Name what came out'
        id: bundle
        run: |
          set -e
          ls -l build/bsd-x86_64-$TARGET_OS/bundles/
          jdk="$(ls build/bsd-x86_64-$TARGET_OS/bundles/jdk-*_bin.tar.gz | head -1)"
          echo "path=$jdk" >> $GITHUB_OUTPUT

      - name: 'Upload the bundle'
        uses: actions/upload-artifact@v6
        with:
          name: jdk-${{ env.TARGET_OS }}${{ env.TARGET_OS == 'netbsd' && env.NETBSD_SETS_VERSION || '' }}-x86_64
          path: ${{ steps.bundle.outputs.path }}
          retention-days: 14
